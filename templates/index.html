<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Core</title>
    <style>
        body { background: #05070b; color: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: #090b11; border-right: 1px solid #141822; display: flex; flex-direction: column; padding: 24px 16px; box-sizing: border-box; z-index: 1000; transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        .sidebar.open { transform: translateX(280px); }
        .sidebar-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; padding-left: 4px; }
        .sidebar-brand span { font-weight: 600; font-size: 14px; letter-spacing: 1.5px; color: #f8fafc; font-family: monospace; }
        .new-chat-btn { background: #111521; border: 1px solid #1e2538; color: #f8fafc; padding: 12px; border-radius: 6px; font-weight: 500; font-size: 13px; cursor: pointer; margin-bottom: 20px; transition: background 0.2s; text-align: center; }
        .new-chat-btn:hover { background: #161c2e; }
        .session-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
        .session-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 6px; background: transparent; cursor: pointer; font-size: 13.5px; color: #94a3b8; transition: all 0.15s; }
        .session-item:hover { background: #0f131f; color: #e2e8f0; }
        .session-item.active { background: #111625; color: #f8fafc; font-weight: 500; }
        .session-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 8px; }
        .delete-btn { background: transparent; border: none; color: #64748b; cursor: pointer; padding: 6px; border-radius: 4px; display: flex; align-items: center; transition: all 0.15s; }
        .delete-btn:hover { color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 4, 7, 0.6); display: none; z-index: 999; backdrop-filter: blur(2px); }
        .overlay.active { display: block; }
        
        /* Modals and Overlays Configuration */
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.95); background: #0b0f17; border: 1px solid #1e2538; border-radius: 8px; padding: 20px; width: 85%; max-width: 320px; z-index: 2000; display: none; opacity: 0; transition: all 0.2s ease; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.7); }
        .modal.active { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .modal h4, .modal h3 { margin: 0 0 10px 0; color: #f8fafc; font-size: 15px; font-weight: 600; }
        .modal p { margin: 0 0 20px 0; color: #94a3b8; font-size: 13.5px; line-height: 1.4; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
        .modal-btn { padding: 8px 14px; border-radius: 4px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; outline: none; }
        .modal-btn.cancel { background: #111521; color: #94a3b8; border: 1px solid #1e2538; }
        .modal-btn.confirm { background: #ef4444; color: #ffffff; }
        
        /* Core Auth Container Overlay Styling */
        .auth-overlay { position: fixed; inset: 0; background: rgba(5, 7, 11, 0.9); backdrop-filter: blur(8px); z-index: 3000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
        .auth-overlay.active { opacity: 1; pointer-events: auto; }
        .auth-card { background: #0b0f17; border: 1px solid #1e2538; border-radius: 8px; padding: 24px; width: 85%; max-width: 340px; box-shadow: 0 20px 40px -15px rgba(0,0,0,0.8); }
        .auth-field { width: 100%; background: #05070b; border: 1px solid #141822; padding: 12px; border-radius: 6px; color: #f8fafc; font-size: 14px; outline: none; box-sizing: border-box; margin-bottom: 12px; transition: border-color 0.2s; }
        .auth-field:focus { border-color: #272e3f; }
        .auth-submit { width: 100%; padding: 12px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; background: #f8fafc; color: #05070b; margin-top: 8px; margin-bottom: 14px; transition: opacity 0.2s; }
        .auth-submit:hover { opacity: 0.9; }
        .auth-error { color: #ef4444; font-size: 12.5px; margin-bottom: 12px; line-height: 1.4; display: none; text-align: center; }

        /* Main Conversational Container Layouts */
        .main-content { flex: 1; display: flex; flex-direction: column; padding: 16px; box-sizing: border-box; width: 100%; }
        .header-bar { display: flex; align-items: center; position: relative; margin-bottom: 12px; height: 48px; width: 100%; border-bottom: 1px solid #0f131f; }
        .menu-btn { background: transparent; border: none; color: #94a3b8; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; position: absolute; left: 0px; top: 8px; z-index: 998; outline: none; padding: 0; }
        .menu-btn:hover { color: #f8fafc; }
        .menu-btn.hidden { opacity: 0; pointer-events: none; }
        .center-brand { display: flex; align-items: center; gap: 8px; margin: 0 auto; }
        .center-brand h2 { color: #f8fafc; font-family: monospace; letter-spacing: 2px; margin: 0; font-size: 15px; font-weight: 600; }
        .chat-box { flex: 1; overflow-y: auto; padding: 8px 4px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 16px; }
        .msg { padding: 12px 16px; border-radius: 8px; max-width: 88%; line-height: 1.5; word-wrap: break-word; font-size: 14.5px; }
        .user { background: #111521; color: #f1f5f9; margin-left: auto; border: 1px solid #182033; }
        .assistant { background: transparent; color: #cbd5e1; align-self: flex-start; padding-left: 0; }
        .input-area { display: flex; gap: 8px; padding-bottom: 4px; position: relative; align-items: center; }
        input { flex: 1; background: #090b11; border: 1px solid #141822; padding: 14px 50px 14px 14px; border-radius: 6px; color: #f8fafc; font-size: 15px; outline: none; }
        input:focus { border-color: #272e3f; }
        button.send-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: transparent; border: none; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; border-radius: 4px; }
        button.send-btn:hover { background: #111521; }
        button.send-btn svg { stroke: #f8fafc; }
    </style>
</head>
<body>
    <!-- Secure Multi-Tenant Guard Overlay Box -->
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-card">
            <h3 id="authTitle" style="font-family: monospace; letter-spacing: 1px;">SYSTEM_ACCESS</h3>
            <p id="authSubtitle" style="color: #64748b; font-size: 13px; margin-top: -4px; margin-bottom: 20px;">Provide security keys to sync matrix profile.</p>
            
            <div id="authErrorMsg" class="auth-error"></div>
            
            <!-- Registration Domain Injector -->
            <div id="regFieldsContainer" style="display: none;">
                <input type="text" id="authName" class="auth-field" placeholder="Full Identity Name">
                <input type="email" id="authEmail" class="auth-field" placeholder="Security Routing Email">
            </div>
            
            <input type="text" id="authUsername" class="auth-field" placeholder="Username">
            <input type="password" id="authPassword" class="auth-field" placeholder="Security Access Password">
            
            <button class="auth-submit" id="authSubmitBtn" onclick="processAuthSubmission()">Synchronize</button>
            
            <div style="text-align: center; font-size: 13px; color: #94a3b8;">
                <span id="authToggleMsg">New user instance?</span>
                <span id="authToggleLink" style="color: #f8fafc; cursor: pointer; text-decoration: underline; margin-left: 4px;" onclick="toggleAuthContext()">Register Account</span>
            </div>
        </div>
    </div>

    <button class="menu-btn" id="hamburgerBtn" onclick="toggleSidebar()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
    <div class="overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <div class="modal" id="customConfirmModal">
        <h4>Delete Thread</h4>
        <p id="modalPromptText">Are you sure you want to permanently delete this conversation log?</p>
        <div class="modal-actions">
            <button class="modal-btn cancel" onclick="closeCustomModal()">Cancel</button>
            <button class="modal-btn confirm" id="modalConfirmBtn">Delete</button>
        </div>
    </div>

    <div class="sidebar" id="sidebarMenu">
        <div class="sidebar-brand">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
            <span>CORE LOGS</span>
        </div>
        <button class="new-chat-btn" onclick="createNewChat()">+ New Thread</button>
        <div class="session-list" id="sessionList"></div>
    </div>
    
    <div class="main-content">
        <div class="header-bar">
            <div class="center-brand">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                <h2>JARVIS</h2>
            </div>
        </div>
        <div class="chat-box" id="chatBox"></div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Message Jarvis..." onkeydown="if(event.key==='Enter') sendPrompt()">
            <button class="send-btn" onclick="sendPrompt()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sessionList = document.getElementById('sessionList');
        const sidebarMenu = document.getElementById('sidebarMenu');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const customConfirmModal = document.getElementById('customConfirmModal');
        const modalPromptText = document.getElementById('modalPromptText');
        const modalConfirmBtn = document.getElementById('modalConfirmBtn');
        
        // Auth UI Selectors
        const authOverlay = document.getElementById('authOverlay');
        const regFieldsContainer = document.getElementById('regFieldsContainer');
        const authTitle = document.getElementById('authTitle');
        const authSubtitle = document.getElementById('authSubtitle');
        const authSubmitBtn = document.getElementById('authSubmitBtn');
        const authToggleMsg = document.getElementById('authToggleMsg');
        const authToggleLink = document.getElementById('authToggleLink');
        const authErrorMsg = document.getElementById('authErrorMsg');

        let currentSessionId = null;
        let pendingDeleteId = null;
        let isLoginState = true;

        window.onload = function() { 
            currentSessionId = null;
            chatBox.innerHTML = '';
            loadSessions(true); 
        };

        // ==========================================
        // 🔐 FRONTEND SECURITY HANDLERS
        // ==========================================

        function toggleAuthContext() {
            isLoginState = !isLoginState;
            authErrorMsg.style.display = 'none';
            
            if(isLoginState) {
                authTitle.innerText = "SYSTEM_ACCESS";
                authSubtitle.innerText = "Provide security keys to sync matrix profile.";
                regFieldsContainer.style.display = "none";
                authSubmitBtn.innerText = "Synchronize";
                authToggleMsg.innerText = "New user instance?";
                authToggleLink.innerText = "Register Account";
            } else {
                authTitle.innerText = "REGISTER_INSTANCE";
                authSubtitle.innerText = "Provision global credentials across internal database fields.";
                regFieldsContainer.style.display = "block";
                authSubmitBtn.innerText = "Initialize Core";
                authToggleMsg.innerText = "Active entity key?";
                authToggleLink.innerText = "Access Framework";
            }
        }

        function processAuthSubmission() {
            authErrorMsg.style.display = 'none';
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value;
            
            if(!username || !password) {
                renderAuthError("Identity parameters cannot hold unassigned records.");
                return;
            }

            let targetUrl = '/login';
            let payload = { username, password };

            if(!isLoginState) {
                const name = document.getElementById('authName').value.trim();
                const email = document.getElementById('authEmail').value.trim();
                if(!name || !email) {
                    renderAuthError("Demographic metadata blocks are required.");
                    return;
                }
                targetUrl = '/register';
                payload = { username, password, name, email };
            }

            fetch(targetUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(async res => {
                const data = await res.json();
                if(!res.ok) throw new Error(data.error || "Authentication structural validation failure.");
                return data;
            })
            .then(data => {
                if(isLoginState) {
                    authOverlay.classList.remove('active');
                    loadSessions();
                } else {
                    alert("Account instance mapped safely. Processing entry handshakes.");
                    toggleAuthContext();
                }
            })
            .catch(err => renderAuthError(err.message));
        }

        function renderAuthError(msg) {
            authErrorMsg.innerText = `[ERROR]: ${msg}`;
            authErrorMsg.style.display = 'block';
        }

        function interceptUnauthorized(status) {
            if (status === 401) {
                authOverlay.classList.add('active');
                return true;
            }
            return false;
        }

        // ==========================================
        // 💬 LAYOUT & APP SCRIPT RUNTIMES
        // ==========================================

        function toggleSidebar() {
            const isOpen = sidebarMenu.classList.toggle('open');
            sidebarOverlay.classList.toggle('active');
            if(isOpen) { hamburgerBtn.classList.add('hidden'); } 
            else { hamburgerBtn.classList.remove('hidden'); }
        }

        function loadSessions(isInitialLoad = false) {
            fetch('/sessions')
                .then(res => {
                    if(interceptUnauthorized(res.status)) return;
                    return res.json();
                })
                .then(data => {
                    if(!data) return;
                    sessionList.innerHTML = '';
                    data.forEach((session) => {
                        const div = document.createElement('div');
                        div.className = `session-item ${session.id === currentSessionId ? 'active' : ''}`;
                        
                        const textSpan = document.createElement('span');
                        textSpan.className = 'session-text';
                        textSpan.innerText = session.title || `Thread Line ${session.id}`;
                        textSpan.onclick = function() { switchSession(session.id); toggleSidebar(); };
                        
                        const deleteBtn = document.createElement('button');
                        deleteBtn.className = 'delete-btn';
                        deleteBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>`;
                        deleteBtn.onclick = function(e) { e.stopPropagation(); triggerCustomDeleteModal(session.id, textSpan.innerText); };
                        
                        div.appendChild(textSpan);
                        div.appendChild(deleteBtn);
                        sessionList.appendChild(div);
                    });
                });
        }

        function triggerCustomDeleteModal(id, title) {
            pendingDeleteId = id;
            modalPromptText.innerText = `Are you sure you want to permanently delete "${title}"?`;
            customConfirmModal.classList.add('active');
            modalConfirmBtn.onclick = executeDeletion;
        }

        function closeCustomModal() { customConfirmModal.classList.remove('active'); pendingDeleteId = null; }

        function executeDeletion() {
            if (!pendingDeleteId) return;
            fetch(`/sessions/delete?session_id=${pendingDeleteId}`, { method: 'DELETE' })
                .then(res => {
                    if(interceptUnauthorized(res.status)) return;
                    return res.json();
                })
                .then(data => {
                    if (!data) return;
                    if (data.status === "success") {
                        if (currentSessionId === pendingDeleteId) { 
                            currentSessionId = null; 
                            chatBox.innerHTML = '';
                        }
                        closeCustomModal();
                        loadSessions();
                    }
                });
        }

        function createNewChat() {
            currentSessionId = null;
            chatBox.innerHTML = '';
            loadSessions();
            if(sidebarMenu.classList.contains('open')) toggleSidebar();
        }

        function switchSession(sessionId) {
            currentSessionId = sessionId;
            chatBox.innerHTML = '';
            fetch(`/history?session_id=${sessionId}`)
                .then(res => {
                    if(interceptUnauthorized(res.status)) return;
                    return res.json();
                })
                .then(messages => {
                    if(!messages) return;
                    messages.forEach(msg => { if (msg.role !== 'system') { appendMessage(msg.role, msg.content); } });
                    loadSessions(); 
                });
        }

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        function sendPrompt() {
            const text = userInput.value.trim();
            if (!text) return;
            
            userInput.value = '';
            appendMessage('user', text);
            const assistantDiv = appendMessage('assistant', '');
            const targetSession = currentSessionId ? currentSessionId : 'null';

            const eventSource = new EventSource(`/stream?prompt=${encodeURIComponent(text)}&session_id=${targetSession}`);
            
            eventSource.onmessage = function(event) {
                if (event.data === "[DONE]") {
                    eventSource.close();
                    loadSessions();
                } else {
                    assistantDiv.innerText += event.data;
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            };

            const idListener = function(event) {
                if(event.lastEventId) {
                    currentSessionId = parseInt(event.lastEventId);
                }
            };
            
            eventSource.addEventListener('message', idListener);
            eventSource.onerror = function(err) { 
                // EventSource standard API does not transmit response headers directly to error events.
                // We drop connections and force a safe re-fetch sequence to evaluate authorization variables cleanly.
                eventSource.close(); 
                fetch('/sessions').then(res => interceptUnauthorized(res.status));
            };
        }
    </script>
</body>
</html>
